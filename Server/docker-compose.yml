version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: justkaaj_postgres
    environment:
      POSTGRES_DB: justkaaj_db
      POSTGRES_USER: justkaaj_user
      POSTGRES_PASSWORD: justkaaj_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
